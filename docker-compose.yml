services:
  # Base de Datos PostgreSQL para pacientes, nodos del árbol y registros clínicos
  postgres:
    image: postgres:16-alpine
    container_name: uci_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uci_monitoring_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uci_monitoring_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis para caché de árbol binario y sesiones activas de hardware/dispositivos
  redis:
    image: redis:7-alpine
    container_name: uci_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend NestJS (UCI Communication & Monitoring)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uci_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: uci_monitoring_db
      DB_SYNCHRONIZE: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: "*"
      JWT_SECRET: super_secret_uci_jwt_key_2026
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
